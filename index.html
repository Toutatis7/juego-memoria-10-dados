<!DOCTYPE html>
<html lang="es">

<head>

    <!--
        ==========================================
        CONFIGURACIÓN BÁSICA DE LA PÁGINA
        ==========================================
    -->

    <meta charset="UTF-8">

    <!--
        Hace que la página se adapte
        correctamente a móviles y tablets
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>
        Juego de Memoria - 10 Dados
    </title>


    <!--
        Conectamos nuestro archivo de estilos CSS
        Todavía lo crearemos después
    -->
    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!--
        ==========================================
        CONTENEDOR PRINCIPAL DEL JUEGO
        ==========================================

        Dentro de este div estará todo nuestro juego:
        - título
        - configuración
        - tablero
        - resultados
    -->

    <main class="contenedor-juego">


        <!-- Título principal -->

        <h1>
            🎲 Juego de Memoria - 10 Dados 🎲
        </h1>



        <!--
            ======================================
            CONFIGURACIÓN DE LA PARTIDA
            ======================================

            Aquí el usuario podrá elegir:
            - dificultad mediante tiempo
            - iniciar partida
        -->

        <section class="configuracion">


            <label for="tiempo">

                Dificultad:

            </label>

            <!-- Cada opcion tiene
                - un texto que vera el jugador
                - un valor en segundos
                
                De momento mantenemos el id="tiempo"
                porque nuestro JavaScript actual
                utiliza ese identificador
                -->



            <select id="tiempo">


                <option value="40">
                    🟢 Fácil — 40 segundos
                </option>


                <option value="30">
                    🟡 Normal — 30 segundos
                </option>


                <option value="20">
                    🟠 Difícil — 20 segundos
                </option>


                <option value="10">
                    🔴 Experto — 10 segundos
                </option>


            </select>



            <!-- Botón para iniciar la partida -->
            <button id="btnIniciar">

                Iniciar Juego

            </button>


        </section>



        <!--
            ======================================
            TABLERO DE LOS DADOS
            ======================================-->

        <section 
            id="tablero"
            class="tablero">


        </section>

        <!--
    ==========================================
    CORTINA DE MEMORIA
    ==========================================

    Esta capa estará oculta al principio.

    Cuando termine el tiempo JavaScript
    cambiará su estado y aparecerá encima
    de los dados.
-->

    <div id="cortina" class="cortina oculto">

        <h2>
            ⏰ Tiempo terminado
            <br>
            ¿Cuántos dados recuerdas?
        </h2>

    </div>

<!--
==========================================
FORMULARIO DE MEMORIA
==========================================

Al principio está oculto.

JavaScript lo mostrará
cuando termine el tiempo.
-->

    <section id="formulario" class="formulario oculto">


        <h2>
            🧠 ¿Qué recuerdas?
        </h2>


        <label for="notas">
            🎵 Notas musicales:
        </label>

        <input 
            type="number"
            id="notas"
            min="0">



        <label for="colores">
            🎨 Colores:
        </label>

        <input 
            type="number"
            id="colores"
            min="0">



        <label for="letras">
            🔤 Letras:
        </label>

        <input 
            type="number"
            id="letras"
            min="0">



        <label for="simbolos">
            🔣 Símbolos:
        </label>

        <input 
            type="number"
            id="simbolos"
            min="0">



        <label for="numeros">
            🔢 Números:
        </label>

        <input 
            type="number"
            id="numeros"
            min="0">



        <label for="animales">
            🐾 Animales:
        </label>

        <input 
            type="number"
            id="animales"
            min="0">



        <!-- boton corregir -->
        <button id="btnCorregir">

            Corregir

        </button>

        <!-- Zona de resultados -->
        <div id="resultado" class="resultado oculto"></div>


    </section>



        <!--
            ======================================
            ZONA DE INFORMACIÓN
            ======================================

            Aquí mostraremos:
            - contador
            - mensajes
            - puntuación

            Actualmente vacío.
        -->


        <section 
            id="informacion"
            class="informacion">

            <!--
                Aqui aparecera el tiempo restante
                durante la partida
            -->
            <h2 id="contador">

            </h2>


        </section>



    </main>



    <!--
        Pie de página del proyecto
    -->

    <footer>

        <p>
            Proyecto desarrollado por Vicente - 2026
        </p>

    </footer>



    <!--
        Conexión con JavaScript

        Lo ponemos al final del body porque
        queremos que primero cargue el HTML.

    -->

    <script src="script.js"></script>


</body>

</html>
